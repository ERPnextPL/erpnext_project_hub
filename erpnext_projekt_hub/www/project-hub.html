{% extends "templates/web.html" %}
{% set full_width = True %}

{% block title %}Project Outliner{% endblock %}

{% block head_include %}
<link rel="stylesheet" href="/assets/erpnext_projekt_hub/frontend/assets/frappe-ui.css?v={{ asset_version }}">
<link rel="stylesheet" href="/assets/erpnext_projekt_hub/frontend/assets/index.css?v={{ asset_version }}">
{% endblock %}

{% block page_content %}
<div id="app"></div>
{% endblock %}

{% block script %}
{{ super() }}
<script>
	window.csrf_token = '{{ csrf_token }}';
	{% for key in boot %}
	window["{{ key }}"] = {{ boot[key] | tojson }};
	{% endfor %}
	// frappe-web.bundle.js already aliased the global translate helper to frappe._,
	// which only ever reads frappe._messages — empty on portal pages. This app's
	// dictionary arrives as window.messages, so bridge it across; without this every
	// translate() call falls through to the untranslated source string.
	// Never write a dot followed by a double underscore anywhere in this file —
	// frappe.utils.jinja.render_template rejects such templates outright.
	if (window.frappe) {
		window.frappe._messages = Object.assign({}, window.frappe._messages || {}, window.messages || {});
	}
</script>
<script type="module" crossorigin src="/assets/erpnext_projekt_hub/frontend/assets/main.js?v={{ asset_version }}"></script>
{% endblock %}
